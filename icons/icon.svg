<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a4b"/>
      <stop offset="1" stop-color="#3d5a6c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="256" cy="212" r="104" fill="url(#sun)"/>
    <!-- haze bands drifting over the sun -->
    <rect x="-20" y="236" width="552" height="44" rx="22" fill="#c9d6dd" opacity="0.55"/>
    <rect x="60" y="296" width="460" height="40" rx="20" fill="#c9d6dd" opacity="0.72"/>
    <rect x="-20" y="352" width="470" height="40" rx="20" fill="#e3ebef" opacity="0.88"/>
    <rect x="110" y="408" width="420" height="36" rx="18" fill="#f4f8fa" opacity="0.96"/>
  </g>
</svg>
